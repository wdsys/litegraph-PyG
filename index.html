<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>LiteGraph for 🐷PyG</title>
	<link rel="stylesheet" type="text/css" href="litegraph.css">
	<script type="text/javascript" src="litegraph.js"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
			overflow: hidden;
			height: 100vh;
			display: flex;
			flex-direction: column;
		}
		
		/* Force saved-nodes panel and its buttons to be visible */
		#saved-nodes {
			display: block !important;
			visibility: visible !important;
			opacity: 1 !important;
			height: auto !important;
			overflow: visible !important;
			position: relative !important;
			z-index: 1000 !important;
		}
		
		#saved-nodes button {
			display: block !important;
			visibility: visible !important;
			opacity: 1 !important;
			position: relative !important;
			z-index: 1001 !important;
		}

		/* Top Panel */
		.top-panel {
			height: 40px;
			background: #2d2d2d;
			border-bottom: 1px solid #444;
			display: flex;
			align-items: center;
			padding: 0 10px;
			gap: 10px;
		}

		.top-panel button {
			background: #404040;
			border: 1px solid #555;
			color: #fff;
			padding: 5px 12px;
			border-radius: 3px;
			cursor: pointer;
			font-size: 12px;
		}

		.top-panel button:hover {
			background: #505050;
		}

		.top-panel .title {
			color: #fff;
			font-weight: bold;
			margin-left: 10px;
		}

		/* Main Content */
		.main-content {
			flex: 1;
			display: flex;
			height: calc(100vh - 40px);
		}

		/* Left Panel */
		.left-panel {
			width: 250px;
			background: #252525;
			border-right: 1px solid #444;
			display: flex;
			flex-direction: column;
			overflow-y: hidden; /* Prevent double scrollbars */
			height: 100%; /* Ensure it takes full height */
		}

		.panel-section {
			border-bottom: 1px solid #444;
			display: flex;
			flex-direction: column;
			flex: 0 0 auto; /* Don't grow, don't shrink, auto basis */
		}

		/* Make the Available Nodes section take more space */
		.panel-section:nth-child(2) {
			flex: 1 0 auto; /* Allow this section to grow */
			overflow: hidden; /* Prevent double scrollbars */
			display: flex;
			flex-direction: column;
		}

		.panel-header {
			background: #2d2d2d;
			color: #fff;
			padding: 8px 12px;
			font-size: 12px;
			font-weight: bold;
			border-bottom: 1px solid #444;
			cursor: pointer;
			user-select: none;
		}

		.panel-content {
			padding: 8px;
			color: #ccc;
			font-size: 12px;
			max-height: 300px; /* Increased from 200px to 300px */
			overflow-y: auto;
		}

		/* Specific styling for Available Nodes panel */
		#nodes-list.panel-content {
			max-height: none; /* Remove max height constraint */
			height: 100%; /* Take full height */
			overflow-y: auto;
			flex: 1; /* Take available space */
			display: flex;
			flex-direction: column;
		}

		/* Make the analyzed nodes container scrollable and take available space */
		#analyzed-nodes-container {
			overflow-y: auto;
			flex: 1;
			margin-top: 10px;
		}

		.file-item, .node-item {
			padding: 4px 8px;
			cursor: pointer;
			border-radius: 2px;
			margin: 1px 0;
		}

		.file-item:hover, .node-item:hover {
			background: #404040;
		}

		.node-item {
			background: #333;
			border: 1px solid #555;
			margin: 2px 0;
			text-align: center;
		}

		.node-item:hover {
			background: #444;
		}

		/* Canvas Area */
		.canvas-area {
			flex: 1;
			position: relative;
			background: #1a1a1a;
		}

		#mycanvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		/* Scrollbars */
		::-webkit-scrollbar {
			width: 8px;
		}

		::-webkit-scrollbar-track {
			background: #2d2d2d;
		}

		::-webkit-scrollbar-thumb {
			background: #555;
			border-radius: 4px;
		}

		::-webkit-scrollbar-thumb:hover {
			background: #666;
		}
	</style>
</head>
<body>
	<!-- Top Panel -->
	<div class="top-panel">
		<button onclick="openFile()">📁 Open LiteGraph JSON</button>
		<button onclick="saveFile()">💾 Save LiteGraph JSON</button>
		<button onclick="newFile()">📄 New LiteGraph</button>
		<button onclick="exportGraph()">📤 Export to PyG Graph JSON</button>
		<button onclick="setupRunWithScript()" style="background: #4CAF50;">▶️ Run Selected PyG Script</button>
		<span class="title">LiteGraph for 🐷PyG</span>
	</div>

	<!-- Main Content -->
	<div class="main-content">
		<!-- Left Panel -->
		<div class="left-panel">
			<!-- File Explorer (temporarily hidden) -->
			<div class="panel-section" style="display: none;">
				<div class="panel-header" onclick="toggleSection('file-explorer')">
					📁 File Explorer
				</div>
				<div id="file-explorer" class="panel-content">
				<div style="margin-bottom: 10px;">
					<button onclick="browseLocalFolder()" style="width: 100%; padding: 5px; background: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer;">📁 Browse Local Folder</button>
				</div>
				<div id="json-files-list">
					<div style="color: #666; font-style: italic; text-align: center; padding: 10px;">Click "Browse Local Folder" to load JSON files</div>
				</div>
			</div>
			</div>

			<!-- Available Nodes -->
			<div class="panel-section">
				<div class="panel-header" onclick="toggleSection('nodes-list')">
					🔧 Available Nodes
				</div>
				<div id="nodes-list" class="panel-content">
					<div style="margin-bottom: 10px;">
						<button onclick="analyzeCodeFolder()" style="width: 100%; padding: 5px; background: #FF9800; color: white; border: none; border-radius: 3px; cursor: pointer;">🔍 Get PyG Nodes from Folder</button>
					</div>

					<div class="node-item" draggable="true" ondragstart="dragNode(event, 'PyG')">PyG general node</div>
					<div id="analyzed-nodes-container">
						<!-- Analyzed nodes will be added here -->
					</div>
				</div>
			</div>

			<!-- Saved Nodes -->
			<div class="panel-section">
				<div class="panel-header" onclick="toggleSection('saved-nodes')">
					💾 Saved Nodes
				</div>
				<div id="saved-nodes" class="panel-content" style="position: relative; z-index: 1000; display: block !important; visibility: visible !important; opacity: 1 !important;">
					<div style="margin-bottom: 10px; display: flex !important; gap: 5px; position: relative; z-index: 1001;">
						<button onclick="exportSavedNodes()" style="flex: 1; padding: 8px; background: #484a48; color: white; border: 2px solid white; border-radius: 3px; cursor: pointer; font-size: 12px; position: relative; z-index: 1002; font-weight: bold; display: block !important; visibility: visible !important; opacity: 1 !important;">📤 Save Loaded Nodes as JSON</button>
						<button onclick="importSavedNodes()" style="flex: 1; padding: 8px; background: #2196F3; color: white; border: 2px solid white; border-radius: 3px; cursor: pointer; font-size: 12px; position: relative; z-index: 1002; font-weight: bold; display: block !important; visibility: visible !important; opacity: 1 !important;">📥 Load Nodes from JSON</button>
					</div>
					<div style="margin-bottom: 10px; position: relative; z-index: 1001; display: block !important;">
						<button onclick="clearSavedNodes()" style="width: 100%; padding: 8px; background: #591703; color: white; border: 2px solid white; border-radius: 3px; cursor: pointer; font-size: 12px; position: relative; z-index: 1002; font-weight: bold; display: block !important; visibility: visible !important; opacity: 1 !important;">🗑️ Clear Loaded Nodes</button>
					</div>
					<!-- Saved nodes will be dynamically added here -->
				</div>
			</div>
		</div>

		<!-- Canvas Area -->
		<div class="canvas-area">
			<canvas id='mycanvas'></canvas>
		</div>
	</div>

	<script>
		// Initialize LiteGraph
		var graph = new LGraph();
		var canvas = new LGraphCanvas("#mycanvas", graph);
		var analyzedNodes = []; // Store analyzed nodes from code folder

		// Initialize with an empty graph

		graph.start();

		// Resize canvas to fit container
		function resizeCanvas() {
			var canvasArea = document.querySelector('.canvas-area');
			var canvas = document.getElementById('mycanvas');
			canvas.width = canvasArea.clientWidth;
			canvas.height = canvasArea.clientHeight;
			if (window.canvas) {
				window.canvas.resize();
			}
		}

		// Initial resize and window resize handler
		window.addEventListener('resize', resizeCanvas);
		setTimeout(resizeCanvas, 100);

		// Top panel functions
		function openFile() {
			var input = document.createElement('input');
			input.type = 'file';
			input.accept = '.json';
			input.onchange = function(e) {
				var file = e.target.files[0];
				if (file) {
					var reader = new FileReader();
					reader.onload = function(e) {
						try {
							var data = JSON.parse(e.target.result);
							
							// Ask user if they want to replace or merge the graph
							const shouldReplace = confirm(`Do you want to replace the current graph with "${file.name}"?\n\nClick OK to replace the current graph.\nClick Cancel to keep your current work.`);
							
							if (shouldReplace) {
								// Load the graph with replacement (this will clear the canvas)
								graph.configure(data);
								// alert('File loaded successfully!');
							} else {
								// User chose to keep current work
								// alert('Operation cancelled. Current graph was preserved.');
							}
						} catch (err) {
							alert('Error loading file: ' + err.message);
						}
					};
					reader.readAsText(file);
				}
			};
			input.click();
		}

		function saveFile() {
			console.log('Save operation started - nodes before save:', graph.list_of_graphnodes ? graph.list_of_graphnodes.length : 0);
			
			// Store current graph state as backup
			var graphBackup = graph.serialize();
			
			try {
				var data = JSON.stringify(graphBackup, null, 2);
				var blob = new Blob([data], {type: 'application/json'});
				var url = URL.createObjectURL(blob);
				var a = document.createElement('a');
				
				// Set attributes to prevent navigation
				a.href = url;
				a.download = 'graph.json';
				a.target = '_self';
				a.style.display = 'none';
				
				// Add to DOM temporarily
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				
				// Add a small delay before revoking the URL to prevent any timing issues
				setTimeout(() => {
					URL.revokeObjectURL(url);
					console.log('Save operation completed - nodes after save:', graph.list_of_graphnodes ? graph.list_of_graphnodes.length : 0);
					
					// Check if canvas was unexpectedly cleared and restore if needed
					if (graph.list_of_graphnodes && graph.list_of_graphnodes.length === 0) {
						console.error('WARNING: Canvas was cleared after save operation! Attempting to restore...');
						graph.configure(graphBackup);
						alert('The canvas was unexpectedly cleared after saving, but has been restored from backup.');
					} else {
						console.log('Save completed successfully without issues.');
					}
				}, 100);
				
			} catch (error) {
				console.error('Error during save operation:', error);
				alert('Error saving file: ' + error.message);
			}
			
			// No need to reload the graph after saving
		}

		function newFile() {
			if (confirm('Create new graph? This will clear the current graph.')) {
				graph.clear();
			}
		}

		function exportGraph(customFilename = 'pyingraph_export.json') {
			// Convert LiteGraph format to PyInGraph format
			var liteGraphData = graph.serialize();
			var pyInGraphData = convertToPyInGraphFormat(liteGraphData);
			
			// Download the converted file
			var data = JSON.stringify(pyInGraphData, null, 2);
			var blob = new Blob([data], {type: 'application/json'});
			var url = URL.createObjectURL(blob);
			var a = document.createElement('a');
			a.href = url;
			a.download = customFilename;
			a.click();
			URL.revokeObjectURL(url);

			// Return the data for potential further use without clearing the canvas
			return { data, pyInGraphData };
		}

		// Function to set up running a Python script with the exported graph
		function setupRunWithScript() {
			// Create a dialog for script selection and execution
			const dialog = document.createElement('div');
			dialog.style.cssText = `
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: #2d2d2d;
				border: 2px solid #4CAF50;
				border-radius: 8px;
				padding: 20px;
				min-width: 500px;
				max-width: 80%;
				max-height: 80vh;
				overflow-y: auto;
				z-index: 1000;
				color: #fff;
				font-family: Arial, sans-serif;
				box-shadow: 0 4px 20px rgba(0,0,0,0.5);
			`;

			dialog.innerHTML = `
				<h3 style="margin-top: 0; color: #4CAF50;">Run Python Script with Exported Graph</h3>
				
				<div style="margin-bottom: 15px;">
					<label style="display: block; margin-bottom: 5px; font-weight: bold;">Step 1: Select Python Script</label>
					<div style="display: flex; gap: 10px;">
						<input type="text" id="selected-script-path" placeholder="No script selected" style="flex: 1; padding: 8px; background: #404040; border: 1px solid #555; color: #fff; border-radius: 3px;" readonly>
						<button id="browse-script-btn" style="background: #404040; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 3px; cursor: pointer;">Browse</button>
					</div>
				</div>

				<div style="margin-bottom: 15px;">
					<label style="display: block; margin-bottom: 5px; font-weight: bold;">Step 2: Export Graph</label>
					<div style="display: flex; gap: 10px;">
						<input type="text" id="export-filename" value="exported_graph.json" style="flex: 1; padding: 8px; background: #404040; border: 1px solid #555; color: #fff; border-radius: 3px;">
						<button id="export-graph-btn" style="background: #404040; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 3px; cursor: pointer;">Export</button>
					</div>
				</div>

				<div style="margin-bottom: 15px;">
					<label style="display: block; margin-bottom: 5px; font-weight: bold;">Step 3: Run Command</label>
					<div style="background: #1a1a1a; padding: 10px; border-radius: 5px; font-family: monospace; margin-bottom: 10px; white-space: pre-wrap;" id="run-command">python <span style="color: #888;">[script_path]</span> <span style="color: #888;">[exported_graph.json]</span></div>
					<div style="font-size: 12px; color: #aaa; margin-bottom: 10px;">
						<strong>Note:</strong> Due to browser security restrictions, we cannot directly execute Python scripts from the browser. 
						You'll need to run this command manually in your terminal/command prompt.
					</div>
					<button id="copy-command-btn" style="background: #404040; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 3px; cursor: pointer; width: 100%;">Copy Command to Clipboard</button>
				</div>

				<div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
					<button id="close-dialog-btn" style="background: #660000; border: 1px solid #555; color: #fff; padding: 8px 15px; border-radius: 3px; cursor: pointer;">Close</button>
				</div>
			`;

			document.body.appendChild(dialog);

			// Get references to elements
			const scriptPathInput = dialog.querySelector('#selected-script-path');
			const browseScriptBtn = dialog.querySelector('#browse-script-btn');
			const exportFilenameInput = dialog.querySelector('#export-filename');
			const exportGraphBtn = dialog.querySelector('#export-graph-btn');
			const runCommandDisplay = dialog.querySelector('#run-command');
			const copyCommandBtn = dialog.querySelector('#copy-command-btn');
			const closeDialogBtn = dialog.querySelector('#close-dialog-btn');

			// Variables to store selected paths
			let selectedScriptPath = '';
			let selectedScriptDir = '';
			let exportedGraphPath = exportFilenameInput.value;

			// Update the command display
			function updateCommandDisplay() {
				if (selectedScriptPath && exportedGraphPath) {
					runCommandDisplay.innerHTML = `python "${selectedScriptPath}" "${exportedGraphPath}"`;
				} else {
					runCommandDisplay.innerHTML = `python <span style="color: #888;">[script_path]</span> <span style="color: #888;">[exported_graph.json]</span>`;
				}
			}

			// Handle script selection
			browseScriptBtn.onclick = async () => {
				try {
					// Check if File System Access API is supported
					if ('showOpenFilePicker' in window) {
						const [fileHandle] = await window.showOpenFilePicker({
							types: [{
								description: 'Python Scripts',
								accept: {
									'text/x-python': ['.py']
								}
							}],
							excludeAcceptAllOption: false,
							multiple: false
						});

						const file = await fileHandle.getFile();
						selectedScriptPath = file.name; // Just the filename for display

						// Try to get the directory path if possible
						try {
							// This might not work in all browsers due to security restrictions
							const dirHandle = await fileHandle.getParent();
							if (dirHandle) {
								selectedScriptDir = dirHandle.name || '';
							}
						} catch (err) {
							console.log('Could not get parent directory:', err);
							// This is expected in many browsers, so we don't show an error
						}

						scriptPathInput.value = selectedScriptPath;
						updateCommandDisplay();
					} else {
						alert('Your browser does not support the File System Access API. Please use a modern browser like Chrome or Edge.');
					}
				} catch (err) {
					if (err.name !== 'AbortError') {
						console.error('Error selecting script:', err);
						alert('Error selecting script: ' + err.message);
					}
				}
			};

			// Handle export filename change
			exportFilenameInput.oninput = () => {
				exportedGraphPath = exportFilenameInput.value;
				updateCommandDisplay();
			};

			// Handle export button
			exportGraphBtn.onclick = () => {
				const filename = exportFilenameInput.value || 'exported_graph.json';
				exportGraph(filename);
				//alert(`Graph exported as "${filename}"`);
				exportedGraphPath = filename;
				updateCommandDisplay();
			};

			// Handle copy command
			copyCommandBtn.onclick = () => {
				const command = runCommandDisplay.textContent;
				navigator.clipboard.writeText(command)
					.then(() => {
						copyCommandBtn.textContent = '✓ Copied!';
						setTimeout(() => {
							copyCommandBtn.textContent = 'Copy Command to Clipboard';
						}, 2000);
					})
					.catch(err => {
						console.error('Error copying command:', err);
						alert('Error copying command: ' + err.message);
					});
			};

			// Handle close button
			closeDialogBtn.onclick = () => {
				document.body.removeChild(dialog);
			};

			// Close on escape
			document.addEventListener('keydown', function escHandler(e) {
				if (e.key === 'Escape') {
					document.body.removeChild(dialog);
					document.removeEventListener('keydown', escHandler);
				}
			});
		}

		function convertToPyInGraphFormat(liteGraphData) {
			var pyInGraphNodes = [];
			var pyInGraphEdges = [];
			var edgeIdCounter = 1;
			
			// Convert nodes
			if (liteGraphData.nodes) {
				liteGraphData.nodes.forEach(function(node, index) {
					var pyInGraphNode = {
						id: "node" + node.id,
						name: node.title || node.type || ("Node " + node.id),
						folder_url: "",
						folder_path: "",
						class_file: "",
						class_name: "",
						parameters: {}
					};
					
					// Handle different node types
					if (node.type === "basic/const") {
						pyInGraphNode.folder_path = "local_modules";
						pyInGraphNode.class_file = "mod_source_constant.py";
						pyInGraphNode.class_name = "ConstantSource";
						pyInGraphNode.parameters = {
							value: node.properties && node.properties.value !== undefined ? node.properties.value : 0
						};
					} else if (node.type === "basic/watch") {
						pyInGraphNode.folder_path = "local_modules";
						pyInGraphNode.class_file = "mod_sink_print.py";
						pyInGraphNode.class_name = "SinkPrint";
						pyInGraphNode.parameters = {};
					} else if (node.type === "PyG") {
						// Use the configurable node's properties
						pyInGraphNode.folder_path = node.properties && node.properties.folder_path ? node.properties.folder_path : "local_modules";
						pyInGraphNode.class_file = node.properties && node.properties.selected_file ? node.properties.selected_file : "custom_module.py";
						pyInGraphNode.class_name = node.properties && node.properties.class_name ? node.properties.class_name : "CustomNode";
						
						// Convert key_value_pairs to parameters
						if (node.properties && node.properties.key_value_pairs) {
							pyInGraphNode.parameters = JSON.parse(JSON.stringify(node.properties.key_value_pairs));
						} else {
							pyInGraphNode.parameters = {};
						}
					} else {
						// Generic node handling
						pyInGraphNode.folder_path = "local_modules";
						pyInGraphNode.class_file = "generic_module.py";
						pyInGraphNode.class_name = "GenericNode";
						pyInGraphNode.parameters = node.properties ? JSON.parse(JSON.stringify(node.properties)) : {};
					}
					
					pyInGraphNodes.push(pyInGraphNode);
				});
			}
			
			// Convert links to edges
			if (liteGraphData.links) {
				liteGraphData.links.forEach(function(link) {
					// LiteGraph link format: [link_id, source_node_id, source_slot, target_node_id, target_slot, type]
					var linkId = link[0];
					var sourceNodeId = link[1];
					var sourceSlot = link[2];
					var targetNodeId = link[3];
					var targetSlot = link[4];
					var linkType = link[5];
					
					var pyInGraphEdge = {
						id: "edge" + edgeIdCounter++,
						source_node_id: "node" + sourceNodeId,
						target_node_id: "node" + targetNodeId,
						source_port_idx: sourceSlot,
						target_port_idx: targetSlot,
						properties: {
							signal_type: linkType || "data_flow",
							weight: 1.0
						}
					};
					
					pyInGraphEdges.push(pyInGraphEdge);
				});
			}
			
			// Create the final PyInGraph structure
			var pyInGraphData = {
				nodes: pyInGraphNodes,
				edges: pyInGraphEdges,
				metadata: {
					version: "1.0",
					description: "Exported from LiteGraph for PyG",
					author: "LiteGraph for PyG User",
					created: new Date().toISOString(),
					tags: ["litegraph", "export"]
				}
			};
			
			return pyInGraphData;
		}



		// Left panel functions
		function toggleSection(sectionId) {
			var section = document.getElementById(sectionId);
			console.log('Toggling section:', sectionId, 'Current display:', section.style.display);
			
			// Special case for saved-nodes panel - always keep it visible
			if (sectionId === 'saved-nodes') {
				section.style.display = 'block';
				console.log('Forced saved-nodes to stay visible');
				return;
			}
			
			if (section.style.display === 'none') {
				section.style.display = 'block';
				console.log('Set to block');
			} else {
				section.style.display = 'none';
				console.log('Set to none');
			}
		}

		// File explorer functions
		let currentFolderHandle = null;
		let jsonFiles = [];

		async function browseLocalFolder() {

		async function loadJsonFile(fileInfo) {

				const data = JSON.parse(text);
				
				// Ask user if they want to replace or merge the graph
				const shouldReplace = confirm(`Do you want to replace the current graph with "${fileInfo.name}"?\n\nClick OK to replace the current graph.\nClick Cancel to keep your current work.`);
				
				if (shouldReplace) {

				}
			} catch (err) {

				var x = e.clientX - rect.left;
				var y = e.clientY - rect.top;

				var canvasPos = canvas.convertEventToCanvasOffset(e);
				
				try {
					// Check if it's a saved configurable node
					if (nodeType.startsWith('saved-configurable-')) {
						var index = parseInt(nodeType.replace('saved-configurable-', ''));
						var savedNodes = JSON.parse(localStorage.getItem('savedConfigurableNodes') || '[]');
						if (savedNodes[index]) {
							var node = LiteGraph.createNode('PyG');
							if (node) {
								node.pos = [canvasPos[0], canvasPos[1]];
								// Apply saved configuration
								var config = savedNodes[index];
								node.properties.input_count = config.input_count;
								node.properties.output_count = config.output_count;
								node.properties.selected_file = config.selected_file;
								node.properties.folder_path = config.folder_path;
								node.properties.class_name = config.class_name;

								// Recreate inputs/outputs first
								node.updateInputsOutputs();
								
								// Create parameter widgets from saved key_value_pairs
								if (config.key_value_pairs && Object.keys(config.key_value_pairs).length > 0) {
									node.createParameterWidgets(config.key_value_pairs);
								}
								
								// Update remaining widget values to reflect the loaded properties
								if (node.widgets) {
									for (let widget of node.widgets) {
										if (widget.name === "Inputs") {
											widget.value = config.input_count;
										} else if (widget.name === "Outputs") {
											widget.value = config.output_count;
										} else if (widget.name === "File") {
											widget.value = config.selected_file || "No file selected";
										} else if (widget.name === "Folder Path") {
											widget.value = config.folder_path || "";
										} else if (widget.name === "Class Name") {
											widget.value = config.class_name || "";
										}
									}
								}

							}
						}
					} else if (nodeType.startsWith('analyzed-node-')) {

							node.properties = node.properties || {};

							node.properties.folder_path = nodeInfo.relativePath || nodeInfo.folderPath;

		async function analyzeFolder(folderHandle, baseFolderPath, relativePath) {
			console.log('Analyzing folder:', baseFolderPath, 'with relative path:', relativePath);
			for await (const [name, handle] of folderHandle.entries()) {
				if (handle.kind === 'file' && name.endsWith('.py')) {
					console.log('Found Python file:', name, 'in path:', relativePath);
					await analyzePythonFile(handle, name, baseFolderPath, relativePath);
				} else if (handle.kind === 'directory') {
					// Recursively analyze subdirectories
					const newRelativePath = relativePath ? `${relativePath}/${name}` : name;
					console.log('Found subdirectory:', name, 'new relative path:', newRelativePath);
					await analyzeFolder(handle, baseFolderPath, newRelativePath);
				}
			}

		async function analyzePythonFile(fileHandle, fileName, baseFolderPath, relativePath) {
			try {
				console.log(`Analyzing Python file: ${fileName} in ${relativePath}`);
				const file = await fileHandle.getFile();
				const content = await file.text();
				
				// Parse Python file to find BlockBase classes
				const classes = parsePythonClasses(content, fileName);
				console.log(`Found ${classes.length} classes in ${fileName}:`, classes.map(c => c.name));
				
				classes.forEach(classInfo => {
					console.log(`Processing class ${classInfo.name}, inherits from BlockBase: ${classInfo.inheritsFromBlockBase}`);
					console.log(`Parameters for ${classInfo.name}:`, classInfo.parameters);
					
					const nodeInfo = {
						name: classInfo.name,
						fileName: fileName,
						folderPath: baseFolderPath,
						relativePath: relativePath,
						className: classInfo.name,
						docstring: classInfo.docstring,
						parameters: classInfo.parameters,
						inheritsFromBlockBase: classInfo.inheritsFromBlockBase
					};
					
					if (classInfo.inheritsFromBlockBase) {
						console.log(`Adding ${classInfo.name} to analyzed nodes with parameters:`, classInfo.parameters);
						analyzedNodes.push(nodeInfo);

		function parsePythonClasses(content, fileName) {
			const classes = [];
			const lines = content.split('\n');
			console.log(`Parsing Python classes from ${fileName} with ${lines.length} lines`);
			
			for (let i = 0; i < lines.length; i++) {
				const line = lines[i];
				const trimmedLine = line.trim();
				
				// Look for class definitions
				const classMatch = trimmedLine.match(/^class\s+(\w+)\s*\(([^)]+)\)\s*:/);
				if (classMatch) {
					const className = classMatch[1];
					const inheritance = classMatch[2];
					console.log(`Found class definition at line ${i}: ${className} inherits from ${inheritance}`);
					
					// Check if it inherits from BlockBase
					const inheritsFromBlockBase = inheritance.includes('BlockBase');
					console.log(`Class ${className} inherits from BlockBase: ${inheritsFromBlockBase}`);
					
					// Extract docstring
					let docstring = '';
					let j = i + 1;
					while (j < lines.length && lines[j].trim() === '') j++; // Skip empty lines
					
					if (j < lines.length) {
						const nextLine = lines[j].trim();
						if (nextLine.startsWith('"""') || nextLine.startsWith("'''")) {
							console.log(`Found docstring at line ${j}`);
							// Multi-line docstring
							const quote = nextLine.substring(0, 3);
							let docLines = [];
							
							if (nextLine.length > 3 && nextLine.endsWith(quote)) {
								// Single line docstring
								docstring = nextLine.substring(3, nextLine.length - 3);
							} else {
								// Multi-line docstring
								docLines.push(nextLine.substring(3));
								j++;
								while (j < lines.length && !lines[j].includes(quote)) {
									docLines.push(lines[j]);
									j++;
								}
								if (j < lines.length) {
									const lastLine = lines[j];
									const endIndex = lastLine.indexOf(quote);
									if (endIndex !== -1) {
										docLines.push(lastLine.substring(0, endIndex));
									}
								}
								docstring = docLines.join('\n').trim();
							}
						}
					}
					
					console.log(`Extracting parameters for class ${className} at line ${i}`);
					// Extract parameters from __init__ method
					const parameters = extractClassParameters(lines, i);
					console.log(`Extracted parameters for ${className}:`, parameters);
					
					classes.push({
						name: className,
						inheritsFromBlockBase: inheritsFromBlockBase,
						docstring: docstring,
						parameters: parameters
					});
					console.log(`Added class ${className} to parsed classes`);
				}
			}
			
			console.log(`Finished parsing ${classes.length} classes from ${fileName}`);
			return classes;
		}

		function extractClassParameters(lines, classStartIndex) {
			const parameters = {};
			console.log('Extracting parameters from class starting at line:', classStartIndex);
			
			// Check if this is the FlowSource class
			let isFlowSource = false;
			const classLine = lines[classStartIndex];
			if (classLine.includes('FlowSource')) {
				isFlowSource = true;
				console.log('*** This is a FlowSource class ***');
			}
			
			// Determine the indentation level of the class definition
			const classIndent = classLine.length - classLine.trimLeft().length;
			console.log('Class indentation level:', classIndent);
			
			// Look for __init__ method
			let initMethodFound = false;
			let initMethodIndent = -1;
			let initMethodLine = -1;
			
			// First pass: scan for attrNamesArr in the entire class
			for (let i = classStartIndex + 1; i < lines.length; i++) {
				const line = lines[i];
				const trimmedLine = line.trim();
				const lineIndent = line.length - line.trimLeft().length;
				
				// Stop if we hit another class or function at the same or lower indentation level
				if ((trimmedLine.startsWith('class ') || (trimmedLine.startsWith('def ') && !trimmedLine.includes('__init__'))) && lineIndent <= classIndent) {
					console.log('Stopping parameter search: found another class/function at same level at line', i);
					break;
				}
				
				// Direct scan for attrNamesArr anywhere in the class
				if (trimmedLine.includes('attrNamesArr')) {
					console.log('Found attrNamesArr directly at line:', i);
					console.log('Line content:', trimmedLine);
					
					// Try different regex patterns to match the array
					let attrMatch = trimmedLine.match(/self\.attrNamesArr\s*=\s*\[([^\]]+)\]/);
					if (!attrMatch) {
						// Try a more flexible pattern
						attrMatch = trimmedLine.match(/attrNamesArr\s*=\s*\[([^\]]+)\]/);
					}
					
					console.log('Regex match result:', attrMatch);
					
					if (attrMatch) {
						console.log('Found attrNamesArr content:', attrMatch[1]);
						const attrs = attrMatch[1].split(',').map(attr => {
							const trimmed = attr.trim();
							// Remove quotes (both single and double)
							return trimmed.replace(/["']/g, '');
						}).filter(attr => attr !== '');
						
						console.log('Parsed attributes:', attrs);
						
						// Add each attribute as a parameter
						attrs.forEach(attr => {
							if (attr) {
								console.log('Processing attribute:', attr);
								parameters[attr] = 0; // Default value
							}
						});
					}
				}
				
				// Look for __init__ method
				if (trimmedLine.includes('def __init__')) {
					console.log('Found __init__ method at line:', i, 'with indent:', lineIndent);
					initMethodFound = true;
					initMethodIndent = lineIndent;
					initMethodLine = i;
				}
			}
			
			// Second pass: look for parameter assignments in __init__ if found, but ONLY for parameters in attrNamesArr
			// This is to get default values for parameters defined in attrNamesArr
			if (initMethodFound && Object.keys(parameters).length > 0) {
				console.log('Processing __init__ method content for default values of attrNamesArr parameters only...');
				
				for (let j = initMethodLine + 1; j < lines.length; j++) {
					const initLine = lines[j];
					const trimmedInitLine = initLine.trim();
					const initLineIndent = initLine.length - initLine.trimLeft().length;
					
					// Only process lines with greater indentation than the __init__ method
					if (initLineIndent <= initMethodIndent && trimmedInitLine !== '') {
						console.log('Stopping init method parsing: found line with same/lower indent at line:', j);
						break;
					}
					
					// Debug each line in __init__ method
					console.log(`Line ${j} (indent ${initLineIndent}):`, trimmedInitLine);
					
					// Look for parameter assignments, but ONLY for parameters already in attrNamesArr
					const paramMatch = trimmedInitLine.match(/self\.(\w+)\s*=\s*(.+)/);
					if (paramMatch && parameters.hasOwnProperty(paramMatch[1])) {
						const paramName = paramMatch[1];
						const paramValue = paramMatch[2].split('#')[0].trim(); // Remove comments
						console.log(`Found default value for attrNamesArr parameter: ${paramName} = ${paramValue}`);
						
						// Try to parse the default value
						let defaultValue = 0;
						if (paramValue.includes('"') || paramValue.includes("'")) {
							defaultValue = paramValue.replace(/["']/g, '');
						} else if (!isNaN(parseFloat(paramValue))) {
							defaultValue = parseFloat(paramValue);
						}
						
						parameters[paramName] = defaultValue;
					}
				}
			}
			
			// Special case for FlowSource - if we still don't have parameters
			if (isFlowSource && Object.keys(parameters).length === 0) {
				console.log('FlowSource detected but no parameters found. Adding hardcoded parameters.');
				['flow_rate', 'pH', 'TDS', 'COD'].forEach(param => {
					parameters[param] = 0;
				});
			}
			
			console.log('Final parameters:', parameters);
			return parameters;
		}

		// Export saved nodes to JSON file
		function exportSavedNodes() {
			try {
				const savedNodes = JSON.parse(localStorage.getItem('savedConfigurableNodes') || '[]');
				
				if (savedNodes.length === 0) {
					alert('No saved nodes to export.');
					return;
				}
				
				const exportData = {
					version: "1.0",
					exported_at: new Date().toISOString(),
					nodes: savedNodes
				};
				
				const data = JSON.stringify(exportData, null, 2);
				const blob = new Blob([data], {type: 'application/json'});
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = 'saved_nodes_' + new Date().toISOString().split('T')[0] + '.json';
				a.click();
				URL.revokeObjectURL(url);
				
				// alert(`Exported ${savedNodes.length} saved nodes successfully!`);
			} catch (err) {
				console.error('Error exporting saved nodes:', err);
				alert('Error exporting saved nodes: ' + err.message);
			}
		}
		
		// Import saved nodes from JSON file
		function importSavedNodes() {
			const input = document.createElement('input');
			input.type = 'file';
			input.accept = '.json';
			input.onchange = function(e) {
				const file = e.target.files[0];
				if (file) {
					const reader = new FileReader();
					reader.onload = function(e) {
						try {
							const importData = JSON.parse(e.target.result);
							
							// Validate import data structure
							if (!importData.nodes || !Array.isArray(importData.nodes)) {
								alert('Invalid file format. Expected a JSON file with saved nodes.');
								return;
							}
							
							const currentNodes = JSON.parse(localStorage.getItem('savedConfigurableNodes') || '[]');
							const importedNodes = importData.nodes;
							
							// Ask user how to handle the import
							const action = confirm(
								`Found ${importedNodes.length} nodes to import.\n\n` +
								`Click OK to MERGE with existing nodes (${currentNodes.length} current).\n` +
								`Click Cancel to REPLACE all existing nodes.`
							);
							
							let finalNodes;
							if (action) {
								// Merge: add imported nodes to existing ones
								finalNodes = [...currentNodes, ...importedNodes];
							} else {
								// Replace: use only imported nodes
								finalNodes = importedNodes;
							}
							
							// Save and update UI
							saveSavedNodes(finalNodes);
							updateSavedNodesPanel(finalNodes);
							
							// alert(`Successfully imported ${importedNodes.length} nodes! Total nodes: ${finalNodes.length}`);
							
						} catch (err) {
							console.error('Error importing saved nodes:', err);
							alert('Error importing file: ' + err.message);
						}
					};
					reader.readAsText(file);
				}
			};
			input.click();
		}

				// alert('All saved nodes have been cleared.');
			}
		}

			// Add class name field (below file field)
			this.addWidget("text", "Class Name", this.properties.class_name, (value) => {

			});

		ConfigurableNode.prototype.saveNodeConfiguration = function() {
			// Validate that the node has meaningful configuration
			if (!this.properties.class_name && !this.properties.folder_path && !this.properties.selected_file) {
				alert('Please configure at least one field (Class Name, Folder Path, or File) before saving.');
				return;

			// Prompt for a name
			const name = prompt('Enter a name for this saved node:', this.properties.class_name || 'My Node');

			// Create configuration object
			const nodeConfig = {
				name: name,
				input_count: this.properties.input_count,
				output_count: this.properties.output_count,
				selected_file: this.properties.selected_file,
				folder_path: this.properties.folder_path,
				class_name: this.properties.class_name,
				key_value_pairs: JSON.parse(JSON.stringify(this.properties.key_value_pairs)), // Deep copy
				saved_at: new Date().toISOString()
			};

			// Load existing saved nodes
			const savedNodes = JSON.parse(localStorage.getItem('savedConfigurableNodes') || '[]');
			
			// Add new configuration

			// alert(`Node "${name}" saved successfully!`);
		};

		ConfigurableNode.prototype.updateInputsOutputs = function() {
			// Initialize arrays if they don't exist
			if (!this.inputs) this.inputs = [];
			if (!this.outputs) this.outputs = [];
			if (!this.widgets) this.widgets = [];

			// Clear existing inputs and outputs
			while (this.inputs.length > 0) {
				this.removeInput(0);
			}
			while (this.outputs.length > 0) {
				this.removeOutput(0);
			}

			// Add inputs
			for (let i = 0; i < this.properties.input_count; i++) {
				this.addInput(`Input ${i + 1}`, "*");
			}

			// Add outputs
			for (let i = 0; i < this.properties.output_count; i++) {
				this.addOutput(`Output ${i + 1}`, "*");
			}

			// Resize node based on content
			this.size[1] = Math.max(200, 80 + Math.max(this.properties.input_count, this.properties.output_count) * 20 + this.widgets.length * 25);
			if (this.setDirtyCanvas) {
				this.setDirtyCanvas(true, true);
			}
		};

		// New method to create parameter widgets based on attrNamesArr
		ConfigurableNode.prototype.createParameterWidgets = function(parameters) {
			console.log('Creating parameter widgets with parameters:', parameters);
			console.log('Parameters type:', typeof parameters);
			console.log('Is parameters array?', Array.isArray(parameters));
			console.log('Parameters constructor:', parameters ? parameters.constructor.name : 'null');
			
			// Remove existing parameter widgets
			if (this.parameter_widgets) {
				console.log('Removing existing parameter widgets:', this.parameter_widgets.length);
				this.parameter_widgets.forEach(widget => {
					const index = this.widgets.indexOf(widget);
					if (index !== -1) {
						this.widgets.splice(index, 1);
					}
				});
			}
			this.parameter_widgets = [];

			// Create widgets for each parameter
			if (parameters && typeof parameters === 'object') {
				console.log('Parameters object keys:', Object.keys(parameters));
				console.log('Parameters stringified:', JSON.stringify(parameters));
				
				Object.entries(parameters).forEach(([paramName, defaultValue]) => {
					console.log(`Creating widget for parameter: ${paramName} = ${defaultValue}`);
					console.log(`Parameter value type: ${typeof defaultValue}`);
					
					// Always use text widget type for all parameters
					const widgetType = 'text';
					let widgetValue;
					
					// Convert all types to string representation
					if (typeof defaultValue === 'object' && defaultValue !== null) {
						// For arrays and objects, use JSON string representation
						widgetValue = JSON.stringify(defaultValue);
					} else {
						// For primitive types, convert to string
						widgetValue = String(defaultValue);
					}
					
					console.log(`Widget type: ${widgetType}, value: ${widgetValue}`);

					// Create the widget
					try {
						const widget = this.addWidget(widgetType, paramName, widgetValue, (value) => {
							// Update the key_value_pairs when parameter changes
							if (!this.properties.key_value_pairs) {
								this.properties.key_value_pairs = {};
							}
							
							// Try to parse the value if it looks like JSON
							let parsedValue = value;
							if ((value.startsWith('[') && value.endsWith(']')) || 
								(value.startsWith('{') && value.endsWith('}'))) {
								try {
									parsedValue = JSON.parse(value);
									console.log(`Parsed JSON value for ${paramName}:`, parsedValue);
								} catch (e) {
									console.warn(`Failed to parse ${value} as JSON, using as string`);
								}
							} else if (!isNaN(Number(value)) && value.trim() !== '') {
								// Try to parse as number if it looks like a number
								parsedValue = Number(value);
								console.log(`Parsed numeric value for ${paramName}:`, parsedValue);
							}
							
							this.properties.key_value_pairs[paramName] = parsedValue;
							console.log(`Widget value updated: ${paramName} = ${parsedValue}`);
							return value; // Return original string for display
						});

						console.log('Widget created:', widget);
						
						// Add tooltip to help with input format
						if (widget.options) {
							widget.options.tooltip = getTooltipForParameter(paramName, defaultValue);
						}
						
						// Store reference to parameter widget
						this.parameter_widgets.push(widget);
						
						// Initialize the key_value_pairs with the parameter
						if (!this.properties.key_value_pairs) {
							this.properties.key_value_pairs = {};
						}
						
						// Store the original value (not the string representation)
						this.properties.key_value_pairs[paramName] = defaultValue;
						console.log(`Added to key_value_pairs: ${paramName} = ${defaultValue}`);
					} catch (error) {
						console.error(`Error creating widget for ${paramName}:`, error);
					}
				});
				
				console.log('Final key_value_pairs:', this.properties.key_value_pairs);
			} else {
				console.log('No parameters provided or invalid parameters object');
			}

			// Update node size to accommodate new widgets
			this.size[1] = Math.max(200, 80 + Math.max(this.properties.input_count, this.properties.output_count) * 20 + this.widgets.length * 25);
			if (this.setDirtyCanvas) {
				this.setDirtyCanvas(true, true);
			}
		};
		
		// Helper function to generate tooltips based on parameter type
		function getTooltipForParameter(paramName, defaultValue) {
			let tooltip = `Parameter: ${paramName}`;
			
			if (Array.isArray(defaultValue)) {
				tooltip += '\nExpected format: Array [value1, value2, ...]';
				tooltip += `\nExample: ${JSON.stringify(defaultValue)}`;
			} else if (typeof defaultValue === 'object' && defaultValue !== null) {
				tooltip += '\nExpected format: Object {key1: value1, key2: value2, ...}';
				tooltip += `\nExample: ${JSON.stringify(defaultValue)}`;
			} else if (typeof defaultValue === 'number') {
				tooltip += '\nExpected format: Number';
				tooltip += `\nExample: ${defaultValue}`;
			} else if (typeof defaultValue === 'boolean') {
				tooltip += '\nExpected format: Boolean (true or false)';
			} else {
				tooltip += '\nExpected format: String';
			}
			
			return tooltip;
		}

		ConfigurableNode.prototype.showKeyValueDialog = function() {
			const dialog = document.createElement('div');
			dialog.style.cssText = `
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: #2d2d2d;
				border: 2px solid #555;
				border-radius: 8px;
				padding: 20px;
				min-width: 400px;
				max-height: 500px;
				overflow-y: auto;
				z-index: 1000;
				color: #fff;
				font-family: Arial, sans-serif;
			`;

			dialog.innerHTML = `
				<h3 style="margin-top: 0; color: #fff;">Key-Value Pairs</h3>
				<div id="kv-container"></div>
				<button id="add-kv" style="background: #404040; border: 1px solid #555; color: #fff; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin: 10px 5px 0 0;">Add Pair</button>
				<button id="save-kv" style="background: #006600; border: 1px solid #555; color: #fff; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin: 10px 5px 0 0;">Save</button>
				<button id="cancel-kv" style="background: #660000; border: 1px solid #555; color: #fff; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin: 10px 0 0 0;">Cancel</button>
			`;

			document.body.appendChild(dialog);

			const container = dialog.querySelector('#kv-container');
			const addBtn = dialog.querySelector('#add-kv');
			const saveBtn = dialog.querySelector('#save-kv');
			const cancelBtn = dialog.querySelector('#cancel-kv');

			// Load existing pairs
			const tempPairs = JSON.parse(JSON.stringify(this.properties.key_value_pairs));

			const renderPairs = () => {
				container.innerHTML = '';
				Object.entries(tempPairs).forEach(([key, value], index) => {
					const pairDiv = document.createElement('div');
					pairDiv.style.cssText = 'display: flex; gap: 10px; margin: 5px 0; align-items: center;';
					pairDiv.innerHTML = `
						<input type="text" value="${key}" placeholder="Key" style="flex: 1; padding: 5px; background: #404040; border: 1px solid #555; color: #fff; border-radius: 3px;" data-type="key" data-index="${index}">
						<input type="text" value="${value}" placeholder="Value" style="flex: 1; padding: 5px; background: #404040; border: 1px solid #555; color: #fff; border-radius: 3px;" data-type="value" data-index="${index}">
						<button onclick="this.parentElement.remove(); delete tempPairs['${key}'];" style="background: #660000; border: 1px solid #555; color: #fff; padding: 5px 8px; border-radius: 3px; cursor: pointer;">×</button>
					`;
					container.appendChild(pairDiv);
				});
			};

			renderPairs();

			addBtn.onclick = () => {
				const newKey = `key_${Object.keys(tempPairs).length + 1}`;
				tempPairs[newKey] = '';
				renderPairs();
			};

			// Handle input changes
			container.addEventListener('input', (e) => {
				if (e.target.dataset.type === 'key') {
					const oldKey = Object.keys(tempPairs)[e.target.dataset.index];
					const newKey = e.target.value;
					if (oldKey !== newKey) {
						tempPairs[newKey] = tempPairs[oldKey];
						delete tempPairs[oldKey];
					}
				} else if (e.target.dataset.type === 'value') {
					const key = Object.keys(tempPairs)[e.target.dataset.index];
					tempPairs[key] = e.target.value;
				}
			});

			saveBtn.onclick = () => {
				this.properties.key_value_pairs = tempPairs;
				document.body.removeChild(dialog);
				this.setDirtyCanvas(true);
			};

			cancelBtn.onclick = () => {
				document.body.removeChild(dialog);
			};

			// Close on escape
			document.addEventListener('keydown', function escHandler(e) {
				if (e.key === 'Escape') {
					document.body.removeChild(dialog);
					document.removeEventListener('keydown', escHandler);
				}
			});
		};

		ConfigurableNode.prototype.onExecute = function() {
			// Process inputs and generate outputs
			for (let i = 0; i < this.properties.output_count; i++) {
				let outputValue = null;
				
				// Simple logic: pass through input if available, otherwise use key-value pairs
				if (i < this.properties.input_count) {
					outputValue = this.getInputData(i);
				}
				
				if (outputValue === undefined || outputValue === null) {
					const keys = Object.keys(this.properties.key_value_pairs);
					if (keys[i]) {
						outputValue = this.properties.key_value_pairs[keys[i]];
					}
				}
				
				this.setOutputData(i, outputValue);
			}
		};

		ConfigurableNode.prototype.onDrawBackground = function(ctx) {
			// Draw file info
			if (this.properties.selected_file) {
				ctx.fillStyle = "#666";
				ctx.font = "10px Arial";
				ctx.fillText(`File: ${this.properties.selected_file}`, 10, this.size[1] - 30);
			}

			// Draw KV pairs count
			const kvCount = Object.keys(this.properties.key_value_pairs).length;
			if (kvCount > 0) {
				ctx.fillStyle = "#666";
				ctx.font = "10px Arial";
				ctx.fillText(`KV Pairs: ${kvCount}`, 10, this.size[1] - 15);
			}
		};

		ConfigurableNode.prototype.onPropertyChanged = function(name, value) {
			if (name === "input_count" || name === "output_count") {
				this.updateInputsOutputs();
			}
		};

		// Serialization - save node state
		ConfigurableNode.prototype.onSerialize = function(o) {
			console.log('ConfigurableNode onSerialize called');
			o.properties = this.properties;
			o.widgets_values = [];
			if (this.widgets) {
				for (let i = 0; i < this.widgets.length; i++) {
					o.widgets_values[i] = this.widgets[i].value;
				}
			}
			console.log('Serialized data:', o);
		};

		// Override the configure method to handle dynamic inputs/outputs properly
		ConfigurableNode.prototype.configure = function(o) {
			console.log('ConfigurableNode configure called with:', o);
			console.log('Serialized inputs:', o.inputs);
			console.log('Serialized outputs:', o.outputs);
			
			// CRITICAL: Don't recreate inputs/outputs if they're already serialized
			// LiteGraph expects the exact same input/output structure for connections
			if (o.inputs && o.outputs) {
				console.log('Using serialized inputs/outputs structure');
				
				// Temporarily disable onPropertyChanged to prevent input/output recreation
				const originalOnPropertyChanged = this.onPropertyChanged;
				this.onPropertyChanged = null;
				
				// Call the base configure - it will restore everything including widgets
				LiteGraph.LGraphNode.prototype.configure.call(this, o);
				
				// Update properties to match the actual input/output counts from serialized data
				this.properties.input_count = this.inputs ? this.inputs.length : 0;
				this.properties.output_count = this.outputs ? this.outputs.length : 0;
				
				// Update widget values to match the actual structure
				if (this.widgets) {
					for (let i = 0; i < this.widgets.length; i++) {
						if (this.widgets[i].name === "Inputs") {
							this.widgets[i].value = this.properties.input_count;
						} else if (this.widgets[i].name === "Outputs") {
							this.widgets[i].value = this.properties.output_count;
						} else if (this.widgets[i].name === "File") {
							this.widgets[i].value = this.properties.selected_file || "No file selected";
						} else if (this.widgets[i].name === "Folder Path") {
							this.widgets[i].value = this.properties.folder_path || "";
						} else if (this.widgets[i].name === "Class Name") {
							this.widgets[i].value = this.properties.class_name || "";
						}
					}
				}
				
				// Recreate parameter widgets from key_value_pairs if they exist
				if (this.properties.key_value_pairs && Object.keys(this.properties.key_value_pairs).length > 0) {
					this.createParameterWidgets(this.properties.key_value_pairs);
				}
				
				// Restore onPropertyChanged
				this.onPropertyChanged = originalOnPropertyChanged;
				
			} else {
				console.log('No serialized inputs/outputs, creating from properties');
				// First restore properties and widget values
				if (o.properties) {
					this.properties = o.properties;
				}
				
				// Restore widget values to get correct input/output counts
				if (o.widgets_values && this.widgets) {
					for (let i = 0; i < this.widgets.length && i < o.widgets_values.length; i++) {
						if (this.widgets[i]) {
							this.widgets[i].value = o.widgets_values[i];
							// Update properties based on widget values
							if (this.widgets[i].name === "Inputs") {
								this.properties.input_count = o.widgets_values[i];
							} else if (this.widgets[i].name === "Outputs") {
								this.properties.output_count = o.widgets_values[i];
							} else if (this.widgets[i].name === "File") {
								this.properties.selected_file = o.widgets_values[i];
							}
						}
					}
				}
				
				// Create inputs/outputs based on properties
				this.updateInputsOutputs();
				
				// Recreate parameter widgets from key_value_pairs if they exist
				if (this.properties.key_value_pairs && Object.keys(this.properties.key_value_pairs).length > 0) {
					this.createParameterWidgets(this.properties.key_value_pairs);
				}
				
				// Call base configure
				LiteGraph.LGraphNode.prototype.configure.call(this, o);
			}
			
			console.log('Final inputs:', this.inputs ? this.inputs.length : 0);
			console.log('Final outputs:', this.outputs ? this.outputs.length : 0);
			
			// Resize node based on content
			this.size[1] = Math.max(200, 80 + Math.max(this.properties.input_count, this.properties.output_count) * 20 + this.widgets.length * 25);
			if (this.setDirtyCanvas) {
				this.setDirtyCanvas(true, true);
			}
			
			console.log('ConfigurableNode configure completed');
		};

		// Register the custom node
		LiteGraph.registerNodeType("PyG", ConfigurableNode);
	</script>
